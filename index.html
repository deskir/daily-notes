<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заметки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --bg-primary: #0f0f14;
            --bg-secondary: #1a1a24;
            --bg-card: #22222e;
            --bg-hover: #2a2a38;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: #818cf8;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d2d3d;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* Шапка */
        .header {
            background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-light), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover { background: var(--bg-hover); transform: translateY(-2px); }
        .icon-btn:active { transform: translateY(0); }

        /* Поиск */
        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus { border-color: var(--accent); background: var(--bg-hover); }
        .search-input::placeholder { color: var(--text-muted); }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Теги-фильтры */
        .tags-filter {
            display: flex;
            gap: 8px;
            padding: 15px 20px;
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid var(--border);
        }

        .tags-filter::-webkit-scrollbar { display: none; }

        .tag-chip {
            padding: 8px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .tag-chip:hover { background: var(--bg-hover); }
        .tag-chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Статистика */
        .stats {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .stats::-webkit-scrollbar { display: none; }

        .stat-card {
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            min-width: 120px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-light);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* Список заметок */
        .notes-container {
            padding: 20px;
        }

        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .notes-title {
            font-size: 18px;
            font-weight: 700;
        }

        .sort-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .notes-grid {
            display: grid;
            gap: 12px;
        }

        .note-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .note-card:hover {
            background: var(--bg-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .note-card:active { transform: translateY(0); }

        .note-card.pinned {
            border-left: 4px solid var(--warning);
        }

        .note-card.pinned::before {
            content: '📌';
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
        }

        .note-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            padding-right: 25px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
        }

        .note-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .note-tag {
            padding: 3px 8px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 6px;
            font-size: 11px;
            color: var(--accent-light);
        }

        .note-mood {
            font-size: 18px;
        }

        /* Пустое состояние */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .empty-text {
            font-size: 14px;
        }

        /* FAB кнопка */
        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 90;
        }

        .fab:hover { transform: scale(1.1) rotate(90deg); }
        .fab:active { transform: scale(0.95); }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-secondary);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            border-radius: 24px 24px 0 0;
            padding: 25px;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .form-textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.5;
        }

        .mood-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mood-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mood-btn:hover { background: var(--bg-hover); }
        .mood-btn.active {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.15);
            transform: scale(1.1);
        }

        .tags-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            min-height: 50px;
            align-items: center;
        }

        .tags-input-container:focus-within { border-color: var(--accent); }

        .tag-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--accent);
            border-radius: 8px;
            font-size: 13px;
            color: white;
        }

        .tag-remove {
            cursor: pointer;
            font-size: 16px;
            opacity: 0.7;
        }

        .tag-remove:hover { opacity: 1; }

        .tag-input {
            flex: 1;
            min-width: 100px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: white;
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { background: var(--bg-hover); }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover { background: #dc2626; }

        /* Меню действий заметки */
        .note-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .note-card:hover .note-actions { opacity: 1; }

        .note-action-btn {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .note-action-btn:hover { color: var(--text-primary); }

        /* Уведомление */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: var(--shadow-lg);
            z-index: 300;
            animation: toastIn 0.3s;
            display: none;
        }

        .toast.show { display: block; }

        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, 20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* Адаптивность */
        @media (min-width: 768px) {
            .notes-grid { grid-template-columns: repeat(2, 1fr); }
            body { padding-bottom: 50px; }
        }

        @media (min-width: 1024px) {
            .notes-grid { grid-template-columns: repeat(3, 1fr); }
            .modal { border-radius: 24px; margin: 20px; max-height: 85vh; }
            .modal-overlay { align-items: center; }
        }

        /* Скрытый input для файлов */
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <div class="header-top">
            <div class="logo"> Заметки</div>
            <div class="header-actions">
                <button class="icon-btn" onclick="exportNotes()" title="Экспорт">📤</button>
                <button class="icon-btn" onclick="document.getElementById('importFile').click()" title="Импорт"></button>
                <input type="file" id="importFile" class="hidden-input" accept=".json" onchange="importNotes(event)">
            </div>
        </div>
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Поиск по заметкам..." oninput="renderNotes()">
        </div>
    </div>

    <!-- Фильтры по тегам -->
    <div class="tags-filter" id="tagsFilter">
        <div class="tag-chip active" data-tag="all" onclick="filterByTag('all')">Все</div>
    </div>

    <!-- Статистика -->
    <div class="stats" id="stats"></div>

    <!-- Список заметок -->
    <div class="notes-container">
        <div class="notes-header">
            <div class="notes-title" id="notesTitle">Все заметки</div>
            <button class="sort-btn" onclick="toggleSort()">
                <span id="sortIcon"></span>
                <span id="sortText">Новые</span>
            </button>
        </div>
        <div class="notes-grid" id="notesGrid"></div>
    </div>

    <!-- FAB -->
    <button class="fab" onclick="openModal()">+</button>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <div class="modal-handle"></div>
            <div class="modal-title" id="modalTitle">Новая заметка</div>
            
            <div class="form-group">
                <label class="form-label">Заголовок</label>
                <input type="text" class="form-input" id="noteTitle" placeholder="О чём заметка?">
            </div>

            <div class="form-group">
                <label class="form-label">Текст</label>
                <textarea class="form-textarea" id="noteText" placeholder="Запиши свои мысли..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Настроение</label>
                <div class="mood-selector" id="moodSelector">
                    <button class="mood-btn" data-mood="😊" onclick="selectMood('😊')">😊</button>
                    <button class="mood-btn" data-mood="🤔" onclick="selectMood('🤔')">🤔</button>
                    <button class="mood-btn" data-mood="💡" onclick="selectMood('💡')">💡</button>
                    <button class="mood-btn" data-mood="😤" onclick="selectMood('😤')">😤</button>
                    <button class="mood-btn" data-mood="🎉" onclick="selectMood('🎉')">🎉</button>
                    <button class="mood-btn" data-mood="😴" onclick="selectMood('😴')">😴</button>
                    <button class="mood-btn" data-mood="🔥" onclick="selectMood('')">🔥</button>
                    <button class="mood-btn" data-mood="❤️" onclick="selectMood('❤️')">❤️</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Теги (Enter для добавления)</label>
                <div class="tags-input-container" onclick="document.getElementById('tagInput').focus()">
                    <div id="tagsList"></div>
                    <input type="text" class="tag-input" id="tagInput" placeholder="Добавить тег..." onkeydown="handleTagInput(event)">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <input type="checkbox" id="notePinned" style="width: 18px; height: 18px;">
                    <span>📌 Закрепить заметку</span>
                </label>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-primary" onclick="saveNote()">Сохранить</button>
            </div>
            <div class="modal-actions" id="deleteAction" style="display: none;">
                <button class="btn btn-danger" onclick="deleteCurrentNote()">🗑️ Удалить</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // === СОСТОЯНИЕ ===
        let notes = JSON.parse(localStorage.getItem('notes') || '[]');
        let currentFilter = 'all';
        let currentSort = 'newest';
        let currentMood = '';
        let currentTags = [];
        let editingId = null;

        // === ИНИЦИАЛИЗАЦИЯ ===
        function init() {
            renderNotes();
            renderTagsFilter();
            renderStats();
        }

        // === РЕНДЕР ЗАМЕТОК ===
        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = notes.filter(note => {
                const matchSearch = !search || 
                    note.title.toLowerCase().includes(search) || 
                    note.text.toLowerCase().includes(search) ||
                    note.tags.some(t => t.toLowerCase().includes(search));
                const matchTag = currentFilter === 'all' || note.tags.includes(currentFilter);
                return matchSearch && matchTag;
            });

            filtered.sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                
                if (currentSort === 'newest') return b.updatedAt - a.updatedAt;
                if (currentSort === 'oldest') return a.updatedAt - b.updatedAt;
                if (currentSort === 'alpha') return a.title.localeCompare(b.title);
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-icon"></div>
                        <div class="empty-title">${search ? 'Ничего не найдено' : 'Пока нет заметок'}</div>
                        <div class="empty-text">${search ? 'Попробуй другой запрос' : 'Нажми + чтобы создать первую'}</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(note => `
                <div class="note-card ${note.pinned ? 'pinned' : ''}" onclick="openNote('${note.id}')">
                    <div class="note-actions" onclick="event.stopPropagation()">
                        <button class="note-action-btn" onclick="togglePin('${note.id}')" title="${note.pinned ? 'Открепить' : 'Закрепить'}">
                            ${note.pinned ? '📌' : ''}
                        </button>
                    </div>
                    <div class="note-title">${escapeHtml(note.title) || 'Без названия'}</div>
                    <div class="note-text">${escapeHtml(note.text)}</div>
                    <div class="note-meta">
                        <div class="note-tags">
                            ${note.tags.slice(0, 3).map(t => `<span class="note-tag">#${escapeHtml(t)}</span>`).join('')}
                            ${note.tags.length > 3 ? `<span class="note-tag">+${note.tags.length - 3}</span>` : ''}
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            ${note.mood ? `<span class="note-mood">${note.mood}</span>` : ''}
                            <span>${formatDate(note.updatedAt)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // === ТЕГИ-ФИЛЬТРЫ ===
        function renderTagsFilter() {
            const allTags = new Set();
            notes.forEach(n => n.tags.forEach(t => allTags.add(t)));
            
            const container = document.getElementById('tagsFilter');
            container.innerHTML = `<div class="tag-chip ${currentFilter === 'all' ? 'active' : ''}" onclick="filterByTag('all')">Все</div>`;
            
            allTags.forEach(tag => {
                container.innerHTML += `<div class="tag-chip ${currentFilter === tag ? 'active' : ''}" onclick="filterByTag('${escapeHtml(tag)}')">#${escapeHtml(tag)}</div>`;
            });
        }

        function filterByTag(tag) {
            currentFilter = tag;
            renderTagsFilter();
            renderNotes();
            document.getElementById('notesTitle').textContent = tag === 'all' ? 'Все заметки' : `#${tag}`;
        }

        // === СТАТИСТИКА ===
        function renderStats() {
            const total = notes.length;
            const pinned = notes.filter(n => n.pinned).length;
            const today = notes.filter(n => {
                const d = new Date(n.updatedAt);
                const now = new Date();
                return d.toDateString() === now.toDateString();
            }).length;
            const allTags = new Set();
            notes.forEach(n => n.tags.forEach(t => allTags.add(t)));

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${total}</div>
                    <div class="stat-label">Всего</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${today}</div>
                    <div class="stat-label">Сегодня</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${pinned}</div>
                    <div class="stat-label">Закреплено</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${allTags.size}</div>
                    <div class="stat-label">Тегов</div>
                </div>
            `;
        }

        // === МОДАЛЬНОЕ ОКНО ===
        function openModal() {
            editingId = null;
            currentMood = '';
            currentTags = [];
            document.getElementById('modalTitle').textContent = 'Новая заметка';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteText').value = '';
            document.getElementById('notePinned').checked = false;
            document.getElementById('deleteAction').style.display = 'none';
            updateMoodUI();
            updateTagsUI();
            document.getElementById('modalOverlay').classList.add('active');
        }

        function openNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            
            editingId = id;
            currentMood = note.mood || '';
            currentTags = [...note.tags];
            document.getElementById('modalTitle').textContent = 'Редактировать';
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteText').value = note.text;
            document.getElementById('notePinned').checked = note.pinned;
            document.getElementById('deleteAction').style.display = 'flex';
            updateMoodUI();
            updateTagsUI();
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnOverlay(e) {
            if (e.target === e.currentTarget) closeModal();
        }

        // === НАСТРОЕНИЕ ===
        function selectMood(mood) {
            currentMood = currentMood === mood ? '' : mood;
            updateMoodUI();
        }

        function updateMoodUI() {
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mood === currentMood);
            });
        }

        // === ТЕГИ ===
        function handleTagInput(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = e.target.value.trim();
                if (val && !currentTags.includes(val)) {
                    currentTags.push(val);
                    updateTagsUI();
                }
                e.target.value = '';
            } else if (e.key === 'Backspace' && !e.target.value && currentTags.length) {
                currentTags.pop();
                updateTagsUI();
            }
        }

        function removeTag(tag) {
            currentTags = currentTags.filter(t => t !== tag);
            updateTagsUI();
        }

        function updateTagsUI() {
            document.getElementById('tagsList').innerHTML = currentTags.map(t => 
                `<div class="tag-item">#${escapeHtml(t)} <span class="tag-remove" onclick="removeTag('${escapeHtml(t)}')">×</span></div>`
            ).join('');
        }

        // === СОХРАНЕНИЕ ===
        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const text = document.getElementById('noteText').value.trim();
            const pinned = document.getElementById('notePinned').checked;

            if (!title && !text) {
                showToast('⚠️ Заметка пустая!');
                return;
            }

            const now = Date.now();
            
            if (editingId) {
                const idx = notes.findIndex(n => n.id === editingId);
                if (idx !== -1) {
                    notes[idx] = { ...notes[idx], title, text, mood: currentMood, tags: currentTags, pinned, updatedAt: now };
                }
                showToast('✅ Заметка обновлена');
            } else {
                notes.push({
                    id: 'note_' + now + '_' + Math.random().toString(36).substr(2, 9),
                    title, text, mood: currentMood, tags: currentTags, pinned,
                    createdAt: now, updatedAt: now
                });
                showToast('✅ Заметка создана');
            }

            saveToStorage();
            closeModal();
            renderNotes();
            renderTagsFilter();
            renderStats();
        }

        function deleteCurrentNote() {
            if (!editingId) return;
            if (!confirm('Удалить заметку?')) return;
            
            notes = notes.filter(n => n.id !== editingId);
            saveToStorage();
            closeModal();
            renderNotes();
            renderTagsFilter();
            renderStats();
            showToast('🗑️ Заметка удалена');
        }

        function togglePin(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                note.pinned = !note.pinned;
                note.updatedAt = Date.now();
                saveToStorage();
                renderNotes();
                renderStats();
            }
        }

        function toggleSort() {
            const sorts = ['newest', 'oldest', 'alpha'];
            const labels = { newest: 'Новые', oldest: 'Старые', alpha: 'А-Я' };
            const icons = { newest: '🕐', oldest: '⏳', alpha: '🔤' };
            const idx = sorts.indexOf(currentSort);
            currentSort = sorts[(idx + 1) % sorts.length];
            document.getElementById('sortText').textContent = labels[currentSort];
            document.getElementById('sortIcon').textContent = icons[currentSort];
            renderNotes();
        }

        // === ЭКСПОРТ/ИМПОРТ ===
        function exportNotes() {
            if (notes.length === 0) {
                showToast('⚠️ Нет заметок для экспорта');
                return;
            }

            const data = {
                version: 1,
                exportedAt: new Date().toISOString(),
                count: notes.length,
                notes: notes
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `notes_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`📤 Экспортировано ${notes.length} заметок`);
        }

        function importNotes(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (!data.notes || !Array.isArray(data.notes)) {
                        throw new Error('Неверный формат файла');
                    }

                    const mode = confirm(
                        `Найдено ${data.notes.length} заметок.\n\n` +
                        `OK — Добавить к существующим\n` +
                        `Отмена — Заменить все заметки`
                    );

                    if (mode) {
                        const existingIds = new Set(notes.map(n => n.id));
                        const newNotes = data.notes.filter(n => !existingIds.has(n.id));
                        notes = [...notes, ...newNotes];
                        showToast(`📥 Добавлено ${newNotes.length} заметок`);
                    } else {
                        notes = data.notes;
                        showToast(` Импортировано ${notes.length} заметок`);
                    }

                    saveToStorage();
                    renderNotes();
                    renderTagsFilter();
                    renderStats();
                } catch (err) {
                    showToast('❌ Ошибка: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // === УТИЛИТЫ ===
        function saveToStorage() {
            localStorage.setItem('notes', JSON.stringify(notes));
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[m]));
        }

        function formatDate(ts) {
            const d = new Date(ts);
            const now = new Date();
            const diff = now - d;
            
            if (diff < 60000) return 'только что';
            if (diff < 3600000) return `${Math.floor(diff/60000)} мин назад`;
            if (diff < 86400000) return `${Math.floor(diff/3600000)} ч назад`;
            if (d.toDateString() === now.toDateString()) return 'сегодня';
            
            const yesterday = new Date(now);
            yesterday.setDate(yesterday.getDate() - 1);
            if (d.toDateString() === yesterday.toDateString()) return 'вчера';
            
            return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Горячие клавиши
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.ctrlKey && e.key === 'n') { e.preventDefault(); openModal(); }
        });

        // Запуск
        init();
    </script>
</body>
</html>
